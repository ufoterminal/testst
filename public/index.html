<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arc Radar · Read-only screener</title><style>
:root{--bg:#071525;--panel:#0d2136;--line:#1b3954;--text:#c8d8ea;--muted:#7892ad;--up:#39d7a0;--down:#ff6c83;--accent:#79aaff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% -10%,#16385a 0,#071525 50%);color:var(--text);font:14px system-ui,Segoe UI,sans-serif}header{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:30px;position:sticky;top:0;background:#071525ee;z-index:2}.brand{font-size:20px;font-weight:700;color:white}.brand span{color:var(--accent);font-size:11px;margin-left:8px}.search{margin-left:auto;background:#0c1e32;border:1px solid var(--line);border-radius:6px;padding:10px 14px;color:white;width:220px}main{max-width:1800px;margin:auto}.hero{padding:35px 32px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.hero h1{font-size:40px;margin:0 0 10px;color:#e8f1fc}.hero p{color:var(--accent);letter-spacing:4px}.stats{display:flex;gap:12px}.stat{background:#102840;border:1px solid #1d476a;border-radius:8px;padding:14px 20px;min-width:130px}.stat small{display:block;color:var(--muted);text-transform:uppercase}.stat b{font-size:20px}.ticker{height:42px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:28px;padding:0 24px;overflow:hidden;color:var(--muted)}.controls{padding:14px 24px;display:flex;gap:8px;border-bottom:1px solid var(--line)}select,input,button{background:#0c2035;border:1px solid #234663;color:var(--text);padding:9px;border-radius:6px}button.active{border-color:var(--accent);color:white}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:1100px}.table th{color:#7899bb;font-size:11px;text-align:right;padding:12px;border-bottom:1px solid var(--line)}.table th:first-child,.table td:first-child{text-align:left}.table td{padding:14px 12px;border-bottom:1px solid #102d47;text-align:right}.token{display:flex;gap:10px;align-items:center}.logo{width:34px;height:34px;border-radius:8px;background:#234668;display:grid;place-items:center}.sub{display:block;color:var(--muted);font-size:12px}.up{color:var(--up)}.down{color:var(--down)}.quality{color:var(--muted);font-size:11px}.notice{padding:12px 24px;color:var(--muted)}@media(max-width:900px){.hero{display:block}.stats{margin-top:20px;overflow:auto}.search{width:150px}}
</style></head><body><header><div class="brand">ARC RADAR <span>READ-ONLY</span></div><input id="search" class="search" placeholder="Token / symbol / address"></header><main><section class="hero"><div><h1>Arc Markets</h1><p>DISCOVER VERIFIED ON-CHAIN MARKETS</p></div><div class="stats"><div class="stat"><small>Tokens</small><b id="tokens">—</b></div><div class="stat"><small>24H Volume</small><b id="volume">—</b></div><div class="stat"><small>Liquidity</small><b id="liq">—</b></div><div class="stat"><small>24H Txns</small><b id="txns">—</b></div></div></section><div class="ticker" id="ticker">Verified Arc data loading…</div><div class="controls"><button class="active" data-sort="volume24h">Volume</button><button data-sort="market_cap">MCap</button><button data-sort="change">Gainers</button><select id="pad"><option value="">All launchpads</option></select><select id="age"><option value="0">All ages</option><option value="3600">&lt; 1 hour</option><option value="86400">&lt; 24 hours</option><option value="604800">&lt; 7 days</option></select><input id="minliq" type="number" placeholder="Min liquidity"><input id="minvol" type="number" placeholder="Min volume"></div><div class="notice" id="notice">Only verified on-chain or source-labelled data is shown. Unknown values remain —.</div><div class="table"><table><thead><tr><th>Token</th><th>Trend</th><th>MCap</th><th>Price</th><th>Age</th><th>Txns</th><th>Volume</th><th>Traders</th><th>Holders</th><th>5M</th><th>1H</th><th>6H</th><th>24H</th><th>Liquidity</th></tr></thead><tbody id="rows"><tr><td colspan="14">Loading…</td></tr></tbody></table></div></main><script src="/market.js" defer></script></body></html>
